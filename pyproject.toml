[project]
name = "mapper-kharon"
version = "0.0.1"
description = "This mapper converts Dow Jones data files into json files ready to load into Senzing"
authors = [{ name = "senzing", email = "support@senzing.com" }]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = [
  "LICENSE",
  ".github/senzing-corporate-contributor-license-agreement.pdf",
  ".github/senzing-individual-contributor-license-agreement.pdf",
]

[project.urls]
bugtracker = "https://github.com/senzing/mapper-kharon/issues"
changelog = "https://github.com/senzing/mapper-kharon/blob/main/CHANGELOG.md"
source = "https://github.com/senzing/mapper-kharon"

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
all = [
  { include-group = "development" },
  { include-group = "documentation" },
  { include-group = "lint" },
  { include-group = "test" },
]
development = [
  "build==1.6.1",
  "coverage==7.16.2",
  "cryptography==50.0.2",
  "psutil==7.2.2",
  "pytest-cov==7.1.0",
  "pytest-schema==0.1.2",
  "pytest==9.2.0",
  "twine==7.0.0",
  "virtualenv==21.15.2",
  "wheel==0.48.0",
]
documentation = [
  "autodocsumm",
  "myst_parser",
  "sphinx-autodoc-typehints",
  "sphinx-gallery",
  "sphinx-jinja2-compat",
  "sphinx-prompt",
  "sphinx-rtd-theme",
  "sphinx-tabs",
  "sphinx-toolbox",
  "sphinx",
  "sphinxcontrib-applehelp",
  "sphinxcontrib-devhelp",
  "sphinxcontrib-htmlhelp",
  "sphinxcontrib-jquery",
  "sphinxcontrib-jsmath",
  "sphinxcontrib-qthelp",
  "sphinxcontrib-serializinghtml",
  "sphinxext-remoteliteralinclude",
]
lint = [
  "bandit==1.9.4",
  "black==26.10.1",
  "flake8==7.4.1",
  "isort==9.0.2",
  "mypy==2.4.1",
  "pylint-per-file-ignores==3.2.1",
  "pylint==4.1.3",
]
test = [
  "pytest==9.2.0",
  "coverage==7.16.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.bandit]
skips = ["B101"]

[tool.black]
line-length = 120

[tool.flake8]
extend-ignore = ["E203", "E704"]
max-line-length = 120

[tool.isort]
profile = "black"
src_paths = ["examples", "src", "tests"]

[tool.pylint]
ignored-argument-names = "args|kwargs"
disable = [
  "consider-using-with",
  "invalid-name",
  "line-too-long",
  "too-many-branches",
  "too-many-lines",
  "too-many-statements",
  "unspecified-encoding",
]
good-names = ["mapper-dowjones"]
ignore = ["__init__.py", "docs/source/conf.py"]
notes = ["FIXME"]
